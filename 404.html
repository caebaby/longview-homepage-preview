<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Page Not Found — LongView Planning Partners</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--navy:#032f57;--blue:#0773bb;--sky:#38b0e3;--off:#f4f8fc;--ink:#0f1923;--body:#52606f}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(145deg,var(--off),#fff);color:var(--ink);font-family:'DM Sans',sans-serif}
    main{width:min(680px,calc(100% - 40px));padding:64px 48px;text-align:center;background:#fff;border:1px solid #dbe7ef;border-top:4px solid var(--sky);border-radius:12px;box-shadow:0 24px 70px rgba(3,47,87,.12)}
    img{width:min(230px,70%);height:auto;margin-bottom:38px}
    .eyebrow{margin:0 0 14px;color:var(--blue);font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;color:var(--navy);font:700 clamp(34px,6vw,54px)/1.08 'Libre Baskerville',serif}
    p{max-width:500px;margin:22px auto 30px;color:var(--body);font-size:17px;line-height:1.7}
    a{display:inline-flex;align-items:center;justify-content:center;padding:14px 24px;border-radius:5px;background:var(--blue);color:#fff;font-weight:600;text-decoration:none;box-shadow:0 8px 22px rgba(7,115,187,.22)}
    a:hover{background:var(--navy)}
    @media(max-width:560px){main{padding:48px 24px}}
  </style>
</head>
<body>
  <main>
    <img src="images/longview-logo.png" alt="LongView Planning Partners">
    <p class="eyebrow">Error 404</p>
    <h1>This page is out of view.</h1>
    <p>The page may have moved, or the link may be out of date. Return to the LongView homepage to continue.</p>
    <a href="index.html">Return to the homepage →</a>
  </main>
</body>
</html>
